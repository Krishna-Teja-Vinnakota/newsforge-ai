services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # Linux kernels 6.19+ can trip MongoDB's TCMalloc startup guard.
    # Disable glibc rseq for this container until the host/kernel combination is fixed.
    environment:
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/newsforge-media;
      mc anonymous set download local/newsforge-media"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: newsforge
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: newsforge-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:${MINIO_API_PORT:-9000}/newsforge-media
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://localhost:${STUDIO_PORT:-5174},http://localhost:${BACKEND_PORT:-8000}
      APP_ENV: development
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@newsforge.dev}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-NewsForgeAdmin#2026}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-NewsForge Administrator}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ENABLE_MOCK_AI: ${ENABLE_MOCK_AI:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GEMINI_SELECTION_MODEL: ${GEMINI_SELECTION_MODEL:-gemini-flash-lite-latest}
      GEMINI_PRODUCTION_MODEL: ${GEMINI_PRODUCTION_MODEL:-gemini-flash-lite-latest}
      GEMINI_TELEMETRY_MODEL: ${GEMINI_TELEMETRY_MODEL:-gemini-flash-lite-latest}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      TRENDS_REFRESH_ENABLED: ${TRENDS_REFRESH_ENABLED:-false}
      TRENDS_SCORING_ENABLED: ${TRENDS_SCORING_ENABLED:-false}
      TRENDS_REFRESH_MINUTES: ${TRENDS_REFRESH_MINUTES:-30}
      TRENDS_MAX_TOTAL_ADJUSTMENT: ${TRENDS_MAX_TOTAL_ADJUSTMENT:-0.10}
      TRENDS_MAX_AGE_HOURS: ${TRENDS_MAX_AGE_HOURS:-6}
      TRENDS_GEO: ${TRENDS_GEO:-US}
      TRENDS_SOURCES: ${TRENDS_SOURCES:-google_news,weather,government,wikipedia}
      TRENDS_CONNECTOR_TIMEOUT_SECONDS: ${TRENDS_CONNECTOR_TIMEOUT_SECONDS:-5}
      TRENDS_MAX_SIGNALS_PER_SOURCE: ${TRENDS_MAX_SIGNALS_PER_SOURCE:-50}
      TRENDS_LEAD_INTAKE_ENABLED: ${TRENDS_LEAD_INTAKE_ENABLED:-false}
      TRENDS_LEAD_MIN_STRENGTH: ${TRENDS_LEAD_MIN_STRENGTH:-0.5}
      TRENDS_LEAD_MAX_PER_REFRESH: ${TRENDS_LEAD_MAX_PER_REFRESH:-5}
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Vite exposes only VITE_* values to browser code. This is a public API
      # address, never an AI credential.
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}/api/v1}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  studio:
    build:
      context: .
      dockerfile: studio/Dockerfile
    restart: unless-stopped
    environment:
      # Same-origin API proxy avoids browser CORS failures when Studio is opened
      # from localhost, 127.0.0.1, a LAN IP, or a reverse proxy.
      VITE_API_BASE_URL: /api/v1
      VITE_DEV_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${STUDIO_PORT:-5174}:5174"

volumes:
  mongo_data:
  minio_data:
